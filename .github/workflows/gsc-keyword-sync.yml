name: Sync GSC Keywords
# Google Search Console Search Analytics API එකෙන් queries අරගෙන
# src/data/gsc-keywords.json එකට ලියයි. generate-alt-text workflow එක
# මේ ගොනුව seed keywords සඳහා කියවයි.
#
# Secret: GOOGLE_INDEXING_KEY (google-indexing.yml එකේ ඒම key එකම).
# Cloud Console එකේ "Google Search Console API" එක enable කරන්න ඕන.
#
# 2026-09 FIX: කලින් version එක "git diff --quiet" එකෙන් වෙනසක්
# තියෙනවද බැලුවා. src/data/ folder එක repo එකේ තිබුණේ නෑ, ඒ නිසා
# පළමු run එකේ gsc-keywords.json එක UNTRACKED file එකක් වුණා -
# git diff untracked files ගණන් ගන්නේ නෑ, ඒ නිසා workflow එක
# "no changes" කියලා exit වෙලා දත්ත නැති වුණා. දැන් git status
# --porcelain පාවිච්චි කරනවා, ඒක untracked සහ modified දෙකම අල්ලනවා.
#
# main ආරක්ෂිත branch එකක් බැවින් direct push නොකරයි. Updates
# automation branch එකකට commit කර PR එකක් ලෙස ඉදිරිපත් කරයි.
# Required CI/Cloudflare checks pass වූ පසුව පමණක් GitHub auto-merge කරයි.
#
# සටහන: GITHUB_TOKEN එකෙන් කරන push එකක් වෙනත් workflow එකක්
# trigger කරන්නේ නෑ (GitHub Actions නීතියක්). ඒ නිසා මේක දිවුවාට
# පස්සේ "AI Image Alt Text" එක manually run කරන්න, නැත්නම් ඒකේ
# දෛනික cron එක එනකම් බලන්න.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of Search Console data to pull"
        type: string
        default: "90"
      min_impressions:
        description: "Minimum impressions to keep a query"
        type: string
        default: "2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gsc-keyword-sync.yml"
      - "scripts/gsc-keyword-sync.mjs"
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: gsc-keyword-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # googleapis එක root package.json එකට touch නොකර isolated
      # /tmp folder එකක install කරයි. Exact pin එක dependency drift
      # වළක්වයි; googleapis-common 9 සඳහා setup-node හි Node 22 භාවිතා වේ.
      - name: Install googleapis in isolated temp folder
        run: |
          mkdir -p /tmp/gsc-tool
          cd /tmp/gsc-tool
          npm init -y >/dev/null 2>&1
          # googleapis@144 is the last known-good GSC client/auth baseline.
          # Replace deprecated uuid@9 with its CommonJS-compatible maintained line.
          npm pkg set 'overrides.uuid=11.1.0'
          npm install googleapis@144.0.0 --no-audit --no-fund
          npm ls googleapis google-auth-library uuid --all

      - name: Pull Search Analytics data
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SITE_HOST: www.walakatha.net
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
          MIN_IMPRESSIONS: ${{ inputs.min_impressions || '2' }}
        run: node scripts/gsc-keyword-sync.mjs

      - name: Commit result (PR + protected auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Non-main validation run: generated keyword data was not committed."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- src/data/gsc-keywords.json)" ]; then
            echo "No keyword changes - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/gsc-keywords.json
          git commit -m "chore(seo): sync Search Console keyword data"
          # Keep protected main untouched; GitHub applies required checks to this PR.
          BRANCH="bot/gsc-keywords"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/gsc-summary.md
            PR_NUMBER="$EXISTING"
            echo "Updated existing PR #$PR_NUMBER"
          else
            PR_URL=$(gh pr create --head "$BRANCH" --base main \
              --title "chore(seo): Search Console keyword sync" \
              --body-file /tmp/gsc-summary.md)
            PR_NUMBER=$(basename "$PR_URL")
          fi
          # GITHUB_TOKEN events do not start pull_request workflows. Dispatch CI
          # on this exact PR head so the required check is produced without bypassing
          # protected-main rules; Cloudflare Pages independently publishes its preview.
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched required CI for $BRANCH."
          gh pr merge "$PR_NUMBER" --auto --squash
          echo "Queued PR #$PR_NUMBER for auto-merge after required checks."
