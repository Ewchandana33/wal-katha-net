name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type-check Astro files
        run: yarn run check

      - name: Test Cloudflare Pages middleware
        run: yarn test

      - name: Test post-recrawl CTR measurement logic
        run: node --test scripts/gsc-ctr-followup.test.mjs

      - name: Test deterministic cover alt policy
        run: node --test scripts/alt-text-policy.test.mjs

      - name: Test recursive post discovery and changelog retention
        run: node --test scripts/post-files.test.mjs scripts/ai-changelog.test.mjs

      - name: Verify all post cover alt text
        run: node scripts/verify-alt-text.mjs

      - name: Build static site
        run: yarn build

      - name: Verify pagination SEO output
        run: node scripts/verify-pagination-seo.mjs

      - name: Verify homepage SEO output
        run: node scripts/verify-homepage-seo.mjs
  cloudflare-preview-smoke:
    name: Cloudflare Preview smoke test
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Find the successful Preview URL from the Cloudflare check
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100,
              });
              const checks = data.check_runs
                .filter(check => check.name === 'Cloudflare Pages' && check.app?.name === 'Cloudflare Workers and Pages')
                .sort((left, right) => right.id - left.id);
              const check = checks[0];
              if (check?.status === 'completed') {
                if (check.conclusion !== 'success') {
                  throw new Error('Cloudflare Pages did not complete successfully for ' + headSha + '.');
                }
                const summary = check.output?.summary || '';
                const match = summary.match(/<strong>Preview URL:<\/strong>[\s\S]*?<a\s+href=['"]([^'"]+)['"]/i);
                if (!match) throw new Error('Cloudflare check did not include a Preview URL.');
                const preview = new URL(match[1]);
                if (preview.protocol !== 'https:' || !preview.hostname.endsWith('.wala-katha.pages.dev')) {
                  throw new Error('Refusing unexpected Cloudflare Preview host: ' + preview.hostname);
                }
                core.setOutput('url', preview.origin);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Cloudflare Pages Preview did not finish within 10 minutes for ' + headSha + '.');

      - name: Verify Preview routes, noindex, and the age gate
        run: node scripts/verify-cloudflare-preview.mjs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
