name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type-check Astro files
        run: yarn run check

      - name: Test Cloudflare Pages middleware
        run: yarn test

      - name: Test post-recrawl CTR measurement logic
        run: node --test scripts/gsc-ctr-followup.test.mjs

      - name: Test deterministic cover alt policy
        run: node --test scripts/alt-text-policy.test.mjs

      - name: Verify all post cover alt text
        run: node scripts/verify-alt-text.mjs

      - name: Build static site
        run: yarn build

      - name: Verify pagination SEO output
        run: node scripts/verify-pagination-seo.mjs

      - name: Verify homepage SEO output
        run: node scripts/verify-homepage-seo.mjs
