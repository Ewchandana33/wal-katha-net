name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type-check Astro files
        run: yarn run check

      - name: Test Cloudflare Pages middleware
        run: yarn test

      - name: Build static site
        run: yarn build

      - name: Verify pagination SEO output
        run: node scripts/verify-pagination-seo.mjs
