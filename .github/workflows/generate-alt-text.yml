name: Deterministic Image Alt Text (SEO)

# Safe, repeatable cover labels require no Gemini credentials or GSC keyword data.
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
      - "scripts/alt-text-policy.mjs"
      - "scripts/generate-alt-text.mjs"
      - "scripts/verify-alt-text.mjs"
      - "scripts/post-files.mjs"
      - "scripts/ai-changelog.mjs"
      - ".github/workflows/generate-alt-text.yml"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: deterministic-image-alt-text
  cancel-in-progress: false
jobs:
  alt-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate safe deterministic cover alt text
        id: alt
        run: node scripts/generate-alt-text.mjs
      - name: Validate every post cover label
        run: node scripts/verify-alt-text.mjs
      - name: Open or update protected automation PR
        if: steps.alt.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Non-main validation only; no automation PR will be opened."
            exit 0
          fi
          if git diff --quiet -- src/content/posts AI_CHANGELOG.md archive; then
            echo "No content or changelog changes; nothing to commit."
            exit 0
          fi
          BRANCH="bot/deterministic-alt-text"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts AI_CHANGELOG.md archive
          git commit -m "seo: repair deterministic cover alt text"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq ".[0].url // empty" || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/alt-text-report.md
            PR_URL="$EXISTING"
            echo "Updated existing PR $PR_URL"
          else
            PR_URL=$(gh pr create --head "$BRANCH" --base main --title "seo: safe deterministic image alt text" --body-file /tmp/alt-text-report.md)
          fi
          # GitHub-token-created PRs need explicit required-check dispatch.
          if [ -n "$EXISTING" ]; then
            IS_DRAFT=$(gh pr view "$PR_URL" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then gh pr ready "$PR_URL"; fi
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$PR_URL" --auto --squash
          echo "Queued $PR_URL for protected auto-merge after required CI and Cloudflare preview checks."
