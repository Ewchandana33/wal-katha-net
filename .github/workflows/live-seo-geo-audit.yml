name: Live SEO and Sri Lanka locale audit
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/layouts/Base.astro"
      - "src/pages/**"
      - "public/robots.txt"
      - "scripts/verify-live-seo.mjs"
      - ".github/workflows/live-seo-geo-audit.yml"
permissions:
  contents: read
concurrency:
  group: live-seo-geo-audit
  cancel-in-progress: true
jobs:
  audit:
    name: Audit live SEO and locale signals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check live homepage, robots, sitemaps, canonicals and locale
        run: node scripts/verify-live-seo.mjs
