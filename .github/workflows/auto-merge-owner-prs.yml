name: Auto-merge trusted same-repository PRs
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: trusted-pr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.login == 'Ewchandana33' ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR' ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot update type
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Queue squash auto-merge after required CI and preview checks
        if: >-
          github.event.pull_request.user.login == 'Ewchandana33' ||
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR' ||
          (github.event.pull_request.user.login == 'dependabot[bot]' &&
            (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
             steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
             steps.metadata.outputs.update-type == 'version-update:semver-major' ||
             steps.metadata.outputs.update-type == 'security-update:semver-patch' ||
             steps.metadata.outputs.update-type == 'security-update:semver-minor' ||
             steps.metadata.outputs.update-type == 'security-update:semver-major'))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
